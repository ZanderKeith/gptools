[build-system]
requires = ["setuptools>=61.0", "wheel", "cython", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "gptools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "emcee>=3.1.6",
    "matplotlib>=3.10.8",
    "mpmath>=1.3.0",
    "numpy>=2.4.1",
    "scipy>=1.17.0",
    "triangle-plot>=0.3.0",
]

[tool.setuptools.packages.find]
include = ["gptools*"]
exclude = ["demo*", "tests*", "docs*"]
